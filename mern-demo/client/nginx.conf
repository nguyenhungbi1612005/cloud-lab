server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver: để nginx phân giải tên miền của Backend khi proxy
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    # Reverse Proxy: mọi request /api/* được chuyển tiếp ngầm tới Backend trên Render
    location /api/ {
        set $backend "mern-backend-238284.onrender.com";
        proxy_pass https://$backend;
        proxy_ssl_server_name on;
        proxy_set_header Host $backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend gói Free có thể đang "ngủ" nên cần chờ lâu hơn
        proxy_connect_timeout 90s;
        proxy_read_timeout 120s;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
