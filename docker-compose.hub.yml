services:
  backend:
    image: bi162005/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://mernuser:Bi1612005@cluster0.xknzmws.mongodb.net/cloud_lab?appName=Cluster0
      - PORT=5000

  frontend:
    image: bi162005/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:80"
    depends_on:
      - backend
